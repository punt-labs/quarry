name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m "not slow and not hook_integration" --cov=quarry --cov-report=xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: coverage.xml
          fail_ci_if_not_token: false

  # quarry-nke8: make test-wheel builds the real wheel, installs it in an
  # isolated venv, boots the daemon, and round-trips a search -- catching
  # wheel-packaging regressions the in-process `test` job above cannot see
  # (missing package_data, a broken console-script entry point, a daemon that
  # fails to boot from the installed artifact). This gate was LOCAL-ONLY
  # (`make check-full`, never CI) until now; that gap is exactly how a real
  # regression stayed green in CI for weeks before it was caught and fixed
  # locally in #429. A separate job, not a step tacked onto `test` above, so a
  # wheel-smoke failure is unambiguous in the checks list rather than buried
  # inside the pytest job's log.
  test-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # No dependency caching for the ~120-220 MB embedding model download
      # (scripts/test-wheel.sh's search round-trip needs a real embedding, so
      # there is no fake to substitute here as tests/hermetic_env.py uses).
      # Every run re-downloads it from the Hugging Face Hub. This is a
      # deliberate trade-off, not an oversight: caching would need a pinned
      # actions/cache SHA this change did not introduce elsewhere in the repo,
      # and the download itself is a small, bounded cost against the
      # documented failure mode this job exists to close (a real regression
      # invisible to CI for weeks). Revisit with actions/cache if download time
      # becomes the bottleneck.
      - run: make test-wheel
