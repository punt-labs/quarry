name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The pytest step alone takes 9 minutes on a healthy runner (run
    # 42922109313), so a 10-minute cap left one minute for checkout, uv sync,
    # and the shellcheck apt install. On 2026-11-11 a slow apt mirror ate
    # 3-4 minutes and cancelled the required check four times (PL-316).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: uv sync --frozen --extra dev
      - run: make coverage-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: coverage.xml
          fail_ci_if_not_token: false

  # Run the installed user flow on both supported platforms.
  test-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: make test-wheel

  # Keep the required ruleset context and fail on any non-success dependency.
  test:
    needs: [pytest, test-wheel]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require pytest and the installed-wheel matrix
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
          WHEEL_RESULT: ${{ needs.test-wheel.result }}
        run: |
          printf 'pytest: %s\nwheel: %s\n' "$PYTEST_RESULT" "$WHEEL_RESULT"
          [[ "$PYTEST_RESULT" == success && "$WHEEL_RESULT" == success ]]
