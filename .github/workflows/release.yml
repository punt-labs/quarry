name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate tag ref
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Release must be triggered by a v* tag push. For manual dispatch, use: gh workflow run release.yml --ref v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-install:
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install from TestPyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: installing punt-quarry==$VERSION from TestPyPI..."
            if uv pip install --system \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              "punt-quarry==$VERSION"; then
              echo "Successfully installed punt-quarry==$VERSION"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 30s..."
            sleep 30
          done
          echo "Failed to install punt-quarry==$VERSION after 5 attempts"
          exit 1
      - name: Verify CLI
        run: quarry --help

  pypi:
    needs: test-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Idempotent re-runs: a partial release (e.g. a later job failing after
          # PyPI already published) can be recovered by re-tagging without the
          # prod publish hard-failing on the already-uploaded version. Matches
          # the testpypi job above.
          skip-existing: true

  # Claude Desktop .mcpb bundle. Self-contained and decoupled from punt-kit's
  # release.py: this job builds the bundle and attaches it to the GitHub release
  # for the tag, then verifies the asset is downloadable. quarry-521g: the
  # README linked to releases/latest/download/punt-quarry.mcpb but no release
  # ever attached it, so the link 404'd.
  #
  # The README-install-SHA staleness check used to run here too, but this is a
  # tag push — install.sh's VERSION line changed on this release's bump commit
  # (punt-kit phase 2) and the README's pin only catches up in a LATER,
  # separate post-release PR (phase 9), which lands after this tag. The check
  # was therefore structurally unsatisfiable on every release (quarry-0u2t:
  # confirmed live on v3.0.3's tag run). It now runs in lint.yml on regular PR
  # CI instead, where install.sh and the README pin are actually expected to
  # agree.
  mcpb:
    # Gate on pypi: the .mcpb is a thin client of the punt-quarry package, so it
    # is only useful once that package is actually published. Without this gate a
    # failed PyPI publish would still create/attach a GitHub release for a version
    # users cannot install.
    needs: [pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required to create/upload GitHub release assets via gh.
      contents: write
    steps:
      - name: Validate tag ref
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Release must be triggered by a v* tag push. For manual dispatch, use: gh workflow run release.yml --ref v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Node is preinstalled on ubuntu-latest; no setup-node action needed.
      # Pin mcpb to an exact version — this job holds contents: write, so a
      # floating/compromised mcpb release must not run with the ability to
      # create and upload the release asset. Bump deliberately.
      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb@2.1.2
      - name: Build .mcpb bundle
        run: ./scripts/build-mcpb.sh
      - name: Attach .mcpb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          # punt-kit phase 7 may create the release concurrently. Wait briefly,
          # then create it ourselves if it still does not exist, so this job is
          # correct whether or not punt-kit runs.
          for _ in 1 2 3 4 5 6; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A concurrent punt-kit create can win the race between the check
            # above and this create, making `gh release create` error even
            # though the release now exists. On create failure, re-check and
            # proceed if it is present rather than failing the workflow.
            if ! gh release create "$TAG" --generate-notes --title "$TAG"; then
              if ! gh release view "$TAG" >/dev/null 2>&1; then
                echo "::error::failed to create release $TAG and it does not exist"
                exit 1
              fi
              echo "release $TAG was created concurrently — proceeding to upload"
            fi
          fi
          gh release upload "$TAG" \
            "dist/punt-quarry.mcpb" \
            "dist/punt-quarry-${VERSION}.mcpb" \
            --clobber
      - name: Verify the .mcpb asset is downloadable
        run: |
          TAG="$GITHUB_REF_NAME"
          url="https://github.com/punt-labs/quarry/releases/download/${TAG}/punt-quarry.mcpb"
          code=$(curl -fsSL -o /dev/null -w '%{http_code}' "$url" || true)
          if [ "$code" != "200" ]; then
            echo "::error::$url returned HTTP $code (expected 200) — the .mcpb asset is missing from the release."
            exit 1
          fi
          echo "OK: $url returns HTTP 200"
