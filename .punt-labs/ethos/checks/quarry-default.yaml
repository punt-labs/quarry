name: quarry-default
description: >-
  Ruff and shellcheck on the edited file (advisory); Ruff, the
  OO/coupling/suppression ratchets and the import boundary at commit. At
  handoff, handoff-fast runs make check-handoff (test-unit and lint, about 8s
  warm) on every handoff, including an empty path list, and handoff-type runs
  make type (about 19s warm) when Python, pyproject.toml, uv.lock or the
  Makefile changed. The make targets total about 27s warm, excluding any
  per-check sandbox setup; the first real hook run decides the true cost.
  Timeouts are 120s each. The full make check runs before the PR and in CI,
  not at handoff.
checks:
  - name: ruff-lint-edit
    stage: edit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, check, --force-exclude, "{file}"]
    on_fail: advisory
    timeout: 10s
  - name: ruff-format-edit
    stage: edit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, format, --check, --force-exclude, "{file}"]
    on_fail: advisory
    timeout: 10s
  - name: shellcheck-edit
    stage: edit
    files: ["**/*.sh"]
    run: [shellcheck, "{file}"]
    on_fail: advisory
    timeout: 10s
  - name: ruff-lint-commit
    stage: commit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, check, --force-exclude, "{files}"]
    on_fail: block
  - name: ruff-format-commit
    stage: commit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, format, --check, --force-exclude, "{files}"]
    on_fail: block
  - name: shellcheck-commit
    stage: commit
    files: ["**/*.sh"]
    run: [shellcheck, "{files}"]
    on_fail: block
  - name: oo-ratchet
    stage: commit
    files: ["src/quarry/**/*.py", ".oo-baseline.json"]
    adapter: make
    target: check-oo
    on_fail: block
  - name: coupling-ratchet
    stage: commit
    files: ["src/quarry/**/*.py", ".oo-coupling-baseline.json"]
    adapter: make
    target: check-coupling
    on_fail: block
  - name: suppression-ratchet
    stage: commit
    files: ["src/quarry/**/*.py", ".suppression-baseline.json"]
    adapter: make
    target: check-suppressions
    on_fail: block
  - name: import-boundary
    stage: commit
    files: ["src/quarry/**/*.py", ".importlinter"]
    adapter: make
    target: check-imports
    on_fail: block
  - name: handoff-fast
    stage: handoff
    files: all
    adapter: make
    target: check-handoff
    on_fail: block
    timeout: 120s
  - name: handoff-type
    stage: handoff
    files: ["**/*.py", "**/*.pyi", "pyproject.toml", "uv.lock", "Makefile"]
    adapter: make
    target: type
    on_fail: block
    timeout: 120s
