name: quarry-default
description: >-
  Ruff and shellcheck on the edited file (advisory); Ruff, the
  OO/coupling/suppression ratchets and the import boundary at commit; at
  handoff, make test-unit (3s), make lint (4s) and make type (19s), measured ~27s
  warm, timeouts 60/60/120s, run only when Python files changed. The full make
  check runs before the PR and in CI, not at handoff.
checks:
  - name: ruff-lint-edit
    stage: edit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, check, --force-exclude, "{file}"]
    on_fail: advisory
    timeout: 10s
  - name: ruff-format-edit
    stage: edit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, format, --check, --force-exclude, "{file}"]
    on_fail: advisory
    timeout: 10s
  - name: shellcheck-edit
    stage: edit
    files: ["**/*.sh"]
    run: [shellcheck, "{file}"]
    on_fail: advisory
    timeout: 10s
  - name: ruff-lint-commit
    stage: commit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, check, --force-exclude, "{files}"]
    on_fail: block
  - name: ruff-format-commit
    stage: commit
    files: ["**/*.py", "**/*.pyi"]
    adapter: uv
    uv: [--extra, dev, ruff, format, --check, --force-exclude, "{files}"]
    on_fail: block
  - name: shellcheck-commit
    stage: commit
    files: ["**/*.sh"]
    run: [shellcheck, "{files}"]
    on_fail: block
  - name: oo-ratchet
    stage: commit
    files: ["src/quarry/**/*.py", ".oo-baseline.json"]
    adapter: make
    target: check-oo
    on_fail: block
  - name: coupling-ratchet
    stage: commit
    files: ["src/quarry/**/*.py", ".oo-coupling-baseline.json"]
    adapter: make
    target: check-coupling
    on_fail: block
  - name: suppression-ratchet
    stage: commit
    files: ["src/quarry/**/*.py", ".suppression-baseline.json"]
    adapter: make
    target: check-suppressions
    on_fail: block
  - name: import-boundary
    stage: commit
    files: ["src/quarry/**/*.py", ".importlinter"]
    adapter: make
    target: check-imports
    on_fail: block
  - name: handoff-unit
    stage: handoff
    files: ["**/*.py", "**/*.pyi"]
    adapter: make
    target: test-unit
    on_fail: block
    timeout: 60s
  - name: handoff-lint
    stage: handoff
    files: ["**/*.py", "**/*.pyi"]
    adapter: make
    target: lint
    on_fail: block
    timeout: 60s
  - name: handoff-type
    stage: handoff
    files: ["**/*.py", "**/*.pyi"]
    adapter: make
    target: type
    on_fail: block
    timeout: 120s
